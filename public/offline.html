<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0D2F6E">
    <title>Sin conexión · IPUC Ciudad de Equidad</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0D2F6E 0%, #1A4FA8 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            color: #1a1a2e;
            max-width: 420px;
            width: 100%;
            border-radius: 14px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 18px;
            display: block;
            border: 4px solid #E8F0FB;
        }
        h1 {
            color: #0D2F6E;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #555E6D;
            font-size: 15px;
            line-height: 1.55;
            margin-bottom: 24px;
        }
        .btn-reintentar {
            background: #F5C518;
            color: #0D2F6E;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity .15s, transform .1s;
        }
        .btn-reintentar:hover { opacity: .88; }
        .btn-reintentar:active { transform: scale(.97); }
        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: #8A94A6;
            letter-spacing: .3px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/LOGO3.jpeg" alt="Logo IPUC" class="logo">
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con el servidor. Revisa tu conexión a internet e inténtalo de nuevo.</p>
        <button type="button" class="btn-reintentar" onclick="window.location.reload()">Reintentar</button>
        <div class="footer">IPUC · Ciudad de Equidad</div>
    </div>
</body>
</html>
